<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{fragments/layout :: layout(title='Catégories', activeSidebar='categories', content=~{::main})}">
<body>
<main>
<div class="page-header">
    <h4><i class="bi bi-tags-fill me-2"></i>Gestion des catégories</h4>
    <a th:href="@{/dashboard/categories/new}" class="btn btn-primary">
        <i class="bi bi-plus-lg me-1"></i>Nouvelle catégorie
    </a>
</div>
<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Libellé</th>
                        <th>Description</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cat : ${categories}">
                        <td th:text="${cat.id}">1</td>
                        <td class="fw-medium" th:text="${cat.libelle}">Boissons</td>
                        <td th:text="${cat.description}">Description</td>
                        <td class="text-end">
                            <a th:href="@{/dashboard/categories/edit/{id}(id=${cat.id})}" class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i></a>
                            <a th:href="@{/dashboard/categories/delete/{id}(id=${cat.id})}" class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Supprimer cette catégorie ?')"><i class="bi bi-trash"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(categories)}">
                        <td colspan="4" class="empty-state">
                            <i class="bi bi-inbox"></i>Aucune catégorie
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</main>
</body>
</html>
