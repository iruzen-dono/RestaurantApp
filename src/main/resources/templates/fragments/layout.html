<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" th:fragment="layout (title, activeSidebar)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - RestaurantApp'">RestaurantApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
    <div class="d-flex" style="min-height: 100vh;">
        <!-- Sidebar Moderne -->
        <div class="sidebar d-flex flex-column flex-shrink-0 p-3">
            <!-- Brand -->
            <div class="brand d-flex align-items-center gap-2 mb-2">
                <div class="brand-icon">
                    <i class="bi bi-shop"></i>
                </div>
                <span class="fs-5 fw-semibold text-white">RestaurantApp</span>
            </div>
            <hr class="divider">

            <!-- Navigation -->
            <div class="nav-section-title">Navigation</div>
            <ul class="nav nav-pills flex-column mb-0">
                <li class="nav-item">
                    <a th:href="@{/dashboard}" class="nav-link" th:classappend="${activeSidebar == 'dashboard' ? 'active' : ''}">
                        <i class="bi bi-grid-fill me-2"></i>Dashboard
                    </a>
                </li>
                <li>
                    <a th:href="@{/dashboard/products}" class="nav-link" th:classappend="${activeSidebar == 'products' ? 'active' : ''}">
                        <i class="bi bi-box-seam-fill me-2"></i>Produits
                    </a>
                </li>
                <li>
                    <a th:href="@{/dashboard/categories}" class="nav-link" th:classappend="${activeSidebar == 'categories' ? 'active' : ''}">
                        <i class="bi bi-tags-fill me-2"></i>Catégories
                    </a>
                </li>
            </ul>

            <div class="nav-section-title">Gestion</div>
            <ul class="nav nav-pills flex-column mb-0">
                <li>
                    <a th:href="@{/dashboard/stock}" class="nav-link" th:classappend="${activeSidebar == 'stock' ? 'active' : ''}">
                        <i class="bi bi-boxes me-2"></i>Stock
                    </a>
                </li>
                <li>
                    <a th:href="@{/dashboard/orders}" class="nav-link" th:classappend="${activeSidebar == 'orders' ? 'active' : ''}">
                        <i class="bi bi-receipt me-2"></i>Commandes
                    </a>
                </li>
                <li>
                    <a th:href="@{/dashboard/stats}" class="nav-link" th:classappend="${activeSidebar == 'stats' ? 'active' : ''}">
                        <i class="bi bi-bar-chart-fill me-2"></i>Statistiques
                    </a>
                </li>
            </ul>

            <!-- Spacer + User -->
            <div class="mt-auto"></div>
            <hr class="divider">
            <div class="user-dropdown dropdown">
                <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
                    <div class="user-avatar me-2">
                        <span th:text="${#authentication.name != null ? #strings.substring(#authentication.name, 0, 1).toUpperCase() : 'A'}">A</span>
                    </div>
                    <div class="d-flex flex-column">
                        <strong class="small" th:text="${#authentication.name}">admin</strong>
                        <span class="small" style="color: rgba(255,255,255,0.5);">Administrateur</span>
                    </div>
                </a>
                <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow-sm border-0">
                    <li><a class="dropdown-item" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-2"></i>Déconnexion</a></li>
                </ul>
            </div>
        </div>

        <!-- Main Content -->
        <div class="d-flex flex-column flex-grow-1" style="min-height: 100vh;">
            <!-- Top Navbar -->
            <nav class="top-navbar d-flex align-items-center justify-content-between">
                <h5 class="page-title">
                    <i class="bi bi-chevron-right text-primary me-1" style="font-size: 0.9rem;"></i>
                    <span th:text="${title}">Dashboard</span>
                </h5>
                <div class="d-flex align-items-center gap-2">
                    <form th:action="@{/logout}" method="POST" class="m-0">
                        <button type="submit" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                        </button>
                    </form>
                </div>
            </nav>

            <!-- Content -->
            <div class="content-wrapper">
                <th:block th:replace="${content}"></th:block>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
