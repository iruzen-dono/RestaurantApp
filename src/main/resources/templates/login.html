<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - RestaurantApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #1a1d23 0%, #2d2f3a 50%, #1a1d23 100%);
            position: relative;
            overflow: hidden;
        }
        .login-page::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(99,102,241,0.06) 0%, transparent 60%);
            animation: loginGlow 15s ease-in-out infinite alternate;
        }
        @keyframes loginGlow {
            0% { transform: translate(0, 0); }
            100% { transform: translate(5%, 5%); }
        }
        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.4);
            background: #fff;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .login-card .card-top {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            padding: 2rem 2rem 1.5rem;
            text-align: center;
            color: #fff;
        }
        .login-card .card-top .icon-wrapper {
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,0.2);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 0.75rem;
            backdrop-filter: blur(4px);
        }
        .login-card .card-top h3 {
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        .login-card .card-top p {
            opacity: 0.8;
            font-size: 0.9rem;
            margin: 0;
        }
        .login-card .card-body {
            padding: 2rem;
        }
        .btn-login {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 10px;
            color: #fff;
            transition: all 0.2s ease;
            width: 100%;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
        }
        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: #a5b4fc;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
        }
        .login-footer {
            background: #f8fafc;
            padding: 1rem 2rem;
            text-align: center;
            border-top: 1px solid #e9edf4;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="login-card">
                        <div class="card-top">
                            <div class="icon-wrapper">
                                <i class="bi bi-shop"></i>
                            </div>
                            <h3>RestaurantApp</h3>
                            <p>Gestion de restaurant</p>
                        </div>
                        <div class="card-body">
                            <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                <span>Identifiants incorrects</span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                            <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center" role="alert">
                                <i class="bi bi-check-circle-fill me-2"></i>
                                <span>Vous êtes déconnecté</span>
                            </div>
                            <form th:action="@{/login}" method="POST">
                                <div class="mb-3">
                                    <label class="form-label"><i class="bi bi-person me-1"></i>Identifiant</label>
                                    <input type="text" name="username" class="form-control" placeholder="Entrez votre identifiant" required autofocus>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label"><i class="bi bi-lock me-1"></i>Mot de passe</label>
                                    <input type="password" name="password" class="form-control" placeholder="Entrez votre mot de passe" required>
                                </div>
                                <button type="submit" class="btn-login btn-lg">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
                                </button>
                            </form>
                        </div>
                        <div class="login-footer">
                            <small class="text-muted">
                                <i class="bi bi-info-circle me-1"></i>Identifiants par défaut : admin / admin123
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
