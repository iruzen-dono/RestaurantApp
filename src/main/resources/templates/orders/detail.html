<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{fragments/layout :: layout(title='Commande #' + ${commande.id}, activeSidebar='orders', content=~{::main})}">
<body>
<main>
<div class="row g-4">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Détail de la commande #<span th:text="${commande.id}">1</span></h5>
                <span class="badge fs-6"
                      th:classappend="${commande.etat == 'VALIDEE'} ? 'bg-success' : ${commande.etat == 'EN_COURS'} ? 'bg-warning' : 'bg-danger'"
                      th:text="${commande.etat == 'VALIDEE'} ? 'Validée' : ${commande.etat == 'EN_COURS'} ? 'En cours' : 'Annulée'}">EN_COURS</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table mb-0">
                        <thead>
                            <tr><th>Produit</th><th>Qté</th><th>Prix unit.</th><th>Montant</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="ligne : ${commande.ligneCommandes}">
                                <td th:text="${ligne.product?.nom}">Produit</td>
                                <td th:text="${ligne.quantite}">1</td>
                                <td th:text="'€' + ${#numbers.formatDecimal(ligne.prixUnitaire, 1, 2)}">€0.00</td>
                                <td class="fw-bold" th:text="'€' + ${#numbers.formatDecimal(ligne.montantLigne, 1, 2)}">€0.00</td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <th colspan="3" class="text-end">Total</th>
                                <th class="fw-bold" th:text="'€' + ${#numbers.formatDecimal(commande.total, 1, 2)}">€0.00</th>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-gear me-2"></i>Actions</h5>
            </div>
            <div class="card-body">
                <p><strong>Date :</strong> <span th:text="${#temporals.format(commande.dateCommande, 'dd/MM/yyyy')}">01/01/2025</span></p>
                <p><strong>Client :</strong> <span th:text="${commande.user?.login}">admin</span></p>
                <hr>
                <label class="form-label fw-medium">Changer le statut</label>
                <form th:action="@{/dashboard/orders/{id}/status(id=${commande.id})}" method="POST" class="d-flex gap-2">
                    <select name="statut" class="form-select">
                        <option value="EN_COURS" th:selected="${commande.etat == 'EN_COURS'}">En cours</option>
                        <option value="VALIDEE" th:selected="${commande.etat == 'VALIDEE'}">Validée</option>
                        <option value="ANNULEE" th:selected="${commande.etat == 'ANNULEE'}">Annulée</option>
                    </select>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i></button>
                </form>
            </div>
        </div>
    </div>
</div>
</main>
</body>
</html>
