<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{fragments/layout :: layout(title='Produits', activeSidebar='products', content=~{::main})}">
<body>
<main>
<div class="page-header">
    <h4><i class="bi bi-box-seam-fill me-2"></i>Gestion des produits</h4>
    <a th:href="@{/dashboard/products/new}" class="btn btn-primary">
        <i class="bi bi-plus-lg me-1"></i>Nouveau produit
    </a>
</div>
<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nom</th>
                        <th>Catégorie</th>
                        <th>Prix</th>
                        <th>Stock</th>
                        <th>Seuil</th>
                        <th>Statut</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${produits}">
                        <td th:text="${p.id}">1</td>
                        <td class="fw-medium" th:text="${p.nom}">Produit</td>
                        <td th:text="${p.category?.libelle}">Catégorie</td>
                        <td th:text="'€' + ${#numbers.formatDecimal(p.prixVente, 1, 2)}">€0.00</td>
                        <td>
                            <span th:text="${p.stockActuel}"
                                  th:classappend="${p.stockActuel <= p.seuilAlerte} ? 'badge bg-danger' : ''">0</span>
                        </td>
                        <td th:text="${p.seuilAlerte}">5</td>
                        <td>
                            <span class="badge" th:classappend="${p.isActive} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${p.isActive} ? 'Actif' : 'Inactif'">Actif</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/dashboard/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/dashboard/products/delete/{id}(id=${p.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Supprimer ce produit ?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(produits)}">
                        <td colspan="8" class="empty-state">
                            <i class="bi bi-inbox"></i>Aucun produit
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</main>
</body>
</html>
